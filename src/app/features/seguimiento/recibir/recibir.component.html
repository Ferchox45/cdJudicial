<div class="w-full min-h-screen bg-cream px-6 py-8">
  <div class="mb-8 text-left">
    <h2 class="text-3xl font-bold text-strong-coffee m-0">Recibir Toca</h2>
    <p class="text-gray-500 mt-1 mb-0">
      Reciba los movimientos de apelaciones turnados a su perfil.
    </p>
  </div>

  <div class="flex flex-col md:flex-row md:items-start gap-4">
    <main class="flex-1 w-full min-w-0 flex flex-col gap-6 pb-24 md:pb-0">
      @if (sala(); as s) {
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm px-5 py-3">
          <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Sala:</span>
          <span class="text-sm font-semibold text-gray-800 ml-2">{{ s.descripcion }}</span>
        </div>
      }
      <app-table-reutilizable
        [columns]="columnas"
        [data]="facade.pendientes()"
        [paginaActual]="facade.paginaActual()"
        [totalPaginas]="facade.totalPaginas()"
        [totalResultados]="facade.totalResultados()"
        [porPagina]="facade.porPagina()"
        titulo="Movimientos Pendientes de Recibir"
        (paginaCambio)="facade.irPagina($event)"
        (limitCambio)="facade.cambiarPorPagina($event)"
        (selectionChange)="onSelectionChange($event)"
        [showSelectAll]="true"
        [allSelected]="todosSeleccionados"
        (selectAllChange)="toggleTodos()"
      />
    </main>

    <aside
      class="fixed bottom-0 left-0 w-full z-50 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.08)] md:bottom-auto md:left-auto md:w-auto md:z-auto md:bg-transparent md:border-none md:shadow-none md:sticky md:top-8 md:self-start md:shrink-0"
    >
      <app-action-sidebar [actions]="sidebarActions" (actionClick)="onAction($event)" />
    </aside>
  </div>
</div>

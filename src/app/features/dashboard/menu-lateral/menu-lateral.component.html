<aside class="w-16 bg-[#d6e9dc] h-screen hidden md:flex flex-col items-center py-5 sticky top-0 shrink-0 border-r border-[#b8d4c0]">

  <!-- Logo -->
  <a routerLink="/inicio"
     class="flex flex-col items-center gap-1 mb-8 cursor-pointer group outline-none">
    <div class="w-8 h-8 border border-[#1e3e2b] rounded-lg flex items-center justify-center text-[#1e3e2b] group-hover:bg-[#1e3e2b] group-hover:text-[#d6e9dc] transition-all duration-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
      </svg>
    </div>
    <span class="text-[8px] font-bold text-[#1e3e2b] tracking-widest uppercase">SIJUDI</span>
  </a>

  <!-- Nav -->
  <nav class="flex flex-col gap-1 w-full px-2">

    <a routerLink="/inicio"
       routerLinkActive="bg-white text-[#1e3e2b] shadow-sm"
       [routerLinkActiveOptions]="{exact: true}"
       class="group w-full py-3 rounded-xl flex flex-col items-center justify-center gap-1 text-[#1e3e2b]/50 hover:text-[#1e3e2b] hover:bg-white/50 transition-all duration-150 outline-none">

      </svg>
      <span class="text-[8px] tracking-wide font-medium">Inicio</span>

    <a routerLink="/capturaApelacion"
       routerLinkActive="bg-white text-[#1e3e2b] shadow-sm"
       class="group w-full py-3 rounded-xl flex flex-col items-center justify-center gap-1 text-[#1e3e2b]/50 hover:text-[#1e3e2b] hover:bg-white/50 transition-all duration-150 outline-none">

    <a routerLink="/buscadorPlano"
       routerLinkActive="bg-white text-[#1e3e2b] shadow-sm"
       class="group w-full py-3 rounded-xl flex flex-col items-center justify-center gap-1 text-[#1e3e2b]/50 hover:text-[#1e3e2b] hover:bg-white/50 transition-all duration-150 outline-none">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h6M8 13h4"/>
      </svg>

    <a routerLink="/buscadorHistorico"
       routerLinkActive="bg-white text-[#1e3e2b] shadow-sm"
       class="group w-full py-3 rounded-xl flex flex-col items-center justify-center gap-1 text-[#1e3e2b]/50 hover:text-[#1e3e2b] hover:bg-white/50 transition-all duration-150 outline-none">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 8v3l2 1.5"/>
      </svg>
      <span class="text-[8px] tracking-wide font-medium">Histórico</span>
    </a>

    <a routerLink="/estadisticasPlana"
       routerLinkActive="bg-white text-[#1e3e2b] shadow-sm"
       class="group w-full py-3 rounded-xl flex flex-col items-center justify-center gap-1 text-[#1e3e2b]/50 hover:text-[#1e3e2b] hover:bg-white/50 transition-all duration-150 outline-none">

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>

  </nav>

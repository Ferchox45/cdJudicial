@if (isOpen()) {
  <div
    (click)="closeMenu.emit()"
    class="fixed inset-0 bg-black/30 z-40 md:hidden transition-opacity duration-300">
  </div>
}

<aside
  cdkTrapFocus
  [cdkTrapFocus]="isOpen()"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  [class.w-56]="isExpandedOrOpen()"
  class="w-16 bg-sidebar-bg h-screen flex flex-col items-center py-5 fixed md:sticky top-0 left-0 shrink-0 border-r border-sidebar-border z-50 transition-all duration-300 ease-in-out md:translate-x-0 overflow-hidden">

  <a routerLink="/inicio"
     (click)="closeMenu.emit()"
     class="flex items-center gap-2 mb-8 cursor-pointer group outline-none w-full px-3">
    <div class="w-8 h-8 shrink-0 border border-heading rounded-lg flex items-center justify-center text-heading group-hover:bg-heading group-hover:text-sidebar-bg transition-all duration-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
      </svg>
    </div>
    @if (isExpandedOrOpen()) {
      <span class="text-2xs font-bold text-heading tracking-widest uppercase whitespace-nowrap">SIJUDI</span>
    }
  </a>

  <nav class="flex flex-col gap-1 w-full px-2">
    <a cdkFocusInitial
       routerLink="/capturaApelacion"
       (click)="closeMenu.emit()"
       routerLinkActive="bg-white text-heading shadow-sm"
       class="group w-full py-3 rounded-xl flex items-center text-heading/50 hover:text-heading hover:bg-white/50 transition-all duration-150 outline-none"
       [class.justify-center]="!isExpandedOrOpen()"
       [class.justify-start]="isExpandedOrOpen()"
       [class.px-3]="isExpandedOrOpen()"
       [class.gap-2]="isExpandedOrOpen()">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      @if (isExpandedOrOpen()) {
        <span class="text-xs tracking-wide font-medium whitespace-nowrap">Apelaciones</span>
      }
    </a>

    <a routerLink="/buscadorPlano"
       (click)="closeMenu.emit()"
       routerLinkActive="bg-white text-heading shadow-sm"
       class="group w-full py-3 rounded-xl flex items-center text-heading/50 hover:text-heading hover:bg-white/50 transition-all duration-150 outline-none"
       [class.justify-center]="!isExpandedOrOpen()"
       [class.justify-start]="isExpandedOrOpen()"
       [class.px-3]="isExpandedOrOpen()"
       [class.gap-2]="isExpandedOrOpen()">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h6M8 13h4"/>
      </svg>
      @if (isExpandedOrOpen()) {
        <span class="text-xs tracking-wide font-medium whitespace-nowrap">Plano</span>
      }
    </a>

    <a routerLink="/buscadorHistorico"
       (click)="closeMenu.emit()"
       routerLinkActive="bg-white text-heading shadow-sm"
       class="group w-full py-3 rounded-xl flex items-center text-heading/50 hover:text-heading hover:bg-white/50 transition-all duration-150 outline-none"
       [class.justify-center]="!isExpandedOrOpen()"
       [class.justify-start]="isExpandedOrOpen()"
       [class.px-3]="isExpandedOrOpen()"
       [class.gap-2]="isExpandedOrOpen()">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 8v3l2 1.5"/>
      </svg>
      @if (isExpandedOrOpen()) {
        <span class="text-xs tracking-wide font-medium whitespace-nowrap">Histórico</span>
      }
    </a>

    <a routerLink="/estadisticasPlana"
       (click)="closeMenu.emit()"
       routerLinkActive="bg-white text-heading shadow-sm"
       class="group w-full py-3 rounded-xl flex items-center text-heading/50 hover:text-heading hover:bg-white/50 transition-all duration-150 outline-none"
       [class.justify-center]="!isExpandedOrOpen()"
       [class.justify-start]="isExpandedOrOpen()"
       [class.px-3]="isExpandedOrOpen()"
       [class.gap-2]="isExpandedOrOpen()">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      @if (isExpandedOrOpen()) {
        <span class="text-xs tracking-wide font-medium whitespace-nowrap">Estadísticas</span>
      }
    </a>
  </nav>

  <button (click)="logout(); closeMenu.emit()"
          class="mt-auto flex items-center rounded-xl text-heading/40 hover:text-red-600 hover:bg-white/50 transition-all duration-150 cursor-pointer outline-none"
          [class.justify-center]="!isExpandedOrOpen()"
          [class.justify-start]="isExpandedOrOpen()"
          [class.w-10]="!isExpandedOrOpen()"
          [class.h-10]="!isExpandedOrOpen()"
          [class.w-full]="isExpandedOrOpen()"
          [class.px-3]="isExpandedOrOpen()"
          [class.py-3]="isExpandedOrOpen()"
          [class.gap-2]="isExpandedOrOpen()">
    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
    </svg>
    @if (isExpandedOrOpen()) {
      <span class="text-xs tracking-wide font-medium whitespace-nowrap">Cerrar sesión</span>
    }
  </button>
</aside>

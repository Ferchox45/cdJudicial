<header class="w-full bg-white border-b border-gray-200 shadow-sm">
  <div class="flex items-center justify-between px-4 py-2 min-h-14">
    <div class="flex items-center gap-3 shrink-0">
      <button
        (click)="toggleMobileMenu.emit()"
        class="md:hidden p-1.5 -ml-2 text-gray-600 hover:bg-gray-100 rounded-lg focus:outline-none transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <button
        (click)="toggleSidebar.emit()"
        [attr.aria-label]="sidebarExpanded() ? 'Contraer menú lateral' : 'Expandir menú lateral'"
        class="hidden md:flex p-1.5 -ml-2 text-gray-600 hover:bg-gray-100 rounded-lg focus:outline-none transition-colors"
      >
        <svg
          class="w-6 h-6 transition-transform duration-300"
          [class.rotate-180]="sidebarExpanded()"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 5l7 7-7 7M5 5l7 7-7 7"
          />
        </svg>
      </button>

      <img
        src="assets/images/logo-oaxaca.png"
        alt="Logo Poder Judicial Oaxaca"
        class="h-10 w-10 object-contain"
      />

      <div class="leading-tight hidden sm:block">
        <p class="text-[11px] font-bold text-gray-700 tracking-wide uppercase">
          Poder Judicial del
        </p>
        <p class="text-[11px] font-bold text-gray-700 tracking-wide uppercase">Estado de Oaxaca</p>
      </div>
    </div>

    <div class="relative flex items-center gap-2.5 shrink-0">
      <button
        type="button"
        (click)="togglePerfilDropdown()"
        class="flex items-center gap-2.5 focus:outline-none cursor-pointer"
      >
        <div class="flex flex-col text-right leading-tight">
          <span class="text-[13px] font-bold text-gray-800 uppercase tracking-wide hidden sm:block">
            {{ userName() }}
          </span>
          @if (perfil()) {
            <span class="text-[11px] text-gray-500 hidden md:block">
              @if (sala(); as s) {
                Sala: {{ s.descripcion }} ·
              }
              Perfil: {{ perfil()!.descripcion }}
            </span>
          }
        </div>

        <div
          class="h-9 w-9 rounded-full bg-gray-300 border border-gray-300 overflow-hidden flex items-center justify-center shrink-0"
        >
          @if (fotoParaMostrar(); as foto) {
            <img
              [src]="foto"
              alt="Foto de perfil"
              class="h-full w-full object-cover"
              (error)="onImgError()"
            />
          } @else {
            <svg
              class="h-6 w-6 text-gray-500"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              />
            </svg>
          }
        </div>
      </button>

      @if (perfilDropdownAbierto()) {
        <div class="fixed inset-0 z-40" (click)="cerrarPerfilDropdown()"></div>
        <div
          class="absolute top-full right-0 mt-2 z-50 w-56 bg-white rounded-lg shadow-lg shadow-gray-200/50 border border-gray-100 py-2"
        >
          <button
            (click)="irASeleccionPerfil()"
            class="group w-full flex items-center justify-between px-4 py-2 text-sm text-gray-600 hover:bg-sage-dark hover:text-gray-900 focus:bg-gray-50 focus:outline-none transition-colors"
          >
            <span class="font-medium">Cambiar Perfil</span>

            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-4 h-4 text-gray-400 group-hover:text-gray-600 group-hover:translate-x-0.5 transition-transform"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>
      }
    </div>
  </div>

  <div
    class="flex items-center gap-1.5 px-4 py-1 bg-gray-50 border-t border-gray-100 text-[13px] text-gray-500"
  >
    <svg
      class="h-3.5 w-3.5 text-gray-400"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 12L12 3l9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" />
    </svg>

    @for (item of breadcrumbs(); track item.label; let isFirst = $first, isLast = $last) {
      @if (!isFirst) {
        <span class="text-gray-400">/</span>
      }

      @if (isLast) {
        <span class="font-medium text-gray-600">{{ item.label }}</span>
      } @else {
        <a
          [routerLink]="item.url"
          class="hover:text-gray-800 font-medium transition-colors cursor-pointer"
        >
          {{ item.label }}
        </a>
      }
    }
  </div>
</header>

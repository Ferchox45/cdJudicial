@if (visible) {
      <div class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="cerrar.emit()"></div>
        <div class="relative z-10 w-full max-w-md mx-4 bg-white rounded-2xl shadow-2xl border border-gray-200 p-6">
          <div class="flex items-center gap-3 mb-4">
            <div class="flex items-center justify-center w-10 h-10 rounded-full"
              [ngClass]="tipo === 'error' ? 'bg-red-100' : 'bg-green-100'">
              @if (tipo === 'error') {
                <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              } @else {
                <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              }
            </div>
            <h2 class="text-lg font-semibold text-gray-800">Aviso</h2>
          </div>
          <p class="text-sm text-gray-500 mb-4" [innerHTML]="mensaje"></p>
          <div class="flex justify-end">
            <button (click)="cerrar.emit()"
              class="px-4 py-2 text-sm font-semibold rounded-lg bg-forest text-white
                     hover:bg-forest active:scale-95 transition-all">
              Aceptar
            </button>
          </div>
        </div>
      </div>
    }

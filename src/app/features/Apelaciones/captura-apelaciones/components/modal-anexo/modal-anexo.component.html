@if (visible) {
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
          <h3 class="text-xl font-bold text-gray-800 mb-2">¡Apelación Registrada!</h3>
          <div class="text-gray-600 mb-6">
            <p class="mb-3">El registro se ha guardado correctamente bajo el folio de oficialía:</p>
            <div class="bg-bronze border border-blue-100 rounded-md p-3 text-center mb-4">
              <span class="text-2xl font-black text-forest tracking-wide">{{ folio }}</span>
            </div>
            <p>¿Deseas adjuntar documentos o anexos a este expediente en este momento?</p>
          </div>
          <div class="flex justify-end gap-3">
            <button type="button" (click)="terminar.emit()"
              class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 border border-gray-300
                     rounded hover:bg-gray-200 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400">
              No, terminar captura
            </button>
            <button type="button" (click)="continuar.emit()"
              class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent
                     rounded hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
              Sí, agregar anexos
            </button>
          </div>
        </div>
      </div>
    }

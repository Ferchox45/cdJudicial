@if (visible) {
  <!-- Fondo oscuro con blur -->
  <div class="fixed inset-0 z-100 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">

    <!-- Contenedor del Modal -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">

      <!-- 1. Encabezado con Icono -->
      <div class="bg-forest/5 p-6 flex flex-col items-center border-b border-gray-100">
        <h3 class="text-xl font-extrabold text-gray-800 text-center m-0">¡Apelación Registrada!</h3>
      </div>

      <!-- 2. Cuerpo del Mensaje -->
      <div class="p-6 text-center">
        <p class="text-gray-600 mb-4 text-sm md:text-base">El registro se ha guardado correctamente bajo el folio de oficialía:</p>

        <!-- Caja del Folio Destacada -->
        <div class="bg-beige border border-forest/20 rounded-xl p-4 mb-5 shadow-inner">
          <span class="text-3xl font-black text-forest tracking-widest">{{ folio }}</span>
        </div>

        <p class="text-sm font-medium text-gray-500 m-0">
          ¿Deseas adjuntar documentos o anexos a este expediente en este momento?
        </p>
      </div>

      <!-- 3. Pie con Botones Responsivos -->
      <div class="bg-gray-50 p-4 md:px-6 md:py-4 flex flex-col-reverse sm:flex-row justify-end gap-3 border-t border-gray-100">

        <button type="button" (click)="terminar.emit()"
          class="w-full sm:w-auto px-5 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-300
                 rounded-lg hover:bg-gray-50 hover:text-gray-900 transition-all focus:outline-none focus:ring-2 focus:ring-gray-200 shadow-sm">
          No, terminar captura
        </button>

        <button type="button" (click)="continuar.emit()"
          class="w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-white bg-forest border border-transparent
                 rounded-lg hover:opacity-90 transition-all focus:outline-none focus:ring-2 focus:ring-forest focus:ring-offset-2 shadow-md flex justify-center items-center gap-2">
          <!-- Icono de Clip -->
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
          </svg>
          Sí, agregar anexos
        </button>

      </div>
    </div>
  </div>
}

@if (visible()) {
  <div class="fixed inset-0 z-100 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h3 class="text-lg font-bold text-gray-800">Certificación</h3>
        <button type="button" (click)="close.emit()" aria-label="Cerrar"
          class="p-1.5 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="flex-1 min-h-0 overflow-auto bg-gray-50 p-6">
        @if (textoCertificacion) {
          <pre class="text-xs font-mono text-gray-800 whitespace-pre-wrap leading-relaxed m-0">{{ textoCertificacion }}</pre>
        } @else {
          <div class="flex items-center justify-center h-full text-gray-400 text-sm">
            Cargando certificación...
          </div>
        }
      </div>

      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 shrink-0">
        <button type="button" (click)="close.emit()"
          class="px-5 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-200">
          Cerrar
        </button>
        <button type="button" (click)="imprimir()"
          class="px-5 py-2.5 text-sm font-bold text-white bg-bronze border border-transparent rounded-lg hover:opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-bronze focus:ring-offset-2 shadow-md flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v6H6v-6z"/>
          </svg>
          Imprimir
        </button>
      </div>
    </div>
  </div>
}

<!-- padre.html — layout principal corregido -->
<!--
  PROBLEMA RESUELTO:
  El sidebar con md:sticky desaparecía en DevTools porque el inspector de Chrome
  agrega overflow:hidden al contenedor, lo que rompe position:sticky.

  SOLUCIÓN: Usar `height: fit-content` en el aside y asegurar que ningún ancestro
  tenga overflow:hidden. El aside ahora también usa `self-start` para no estirarse.
-->

<app-main-header></app-main-header>

<div class="w-full min-h-screen bg-cream px-4 py-8">

  <!-- Encabezado de página -->
  <div class="mb-8 text-left max-w-350 mx-auto">
    <h2 class="text-3xl font-bold text-strong-coffee m-0">Búsqueda de Apelaciones</h2>
    <p class="text-gray-500 mt-1 mb-0">Consulte el historial y estatus de apelaciones registradas en el sistema.</p>
  </div>

  <!--
    LAYOUT PRINCIPAL
    ─────────────────────────────────────────────────────────────────────────
    • Móvil  → columna única, sidebar fijo pegado al fondo (fixed bottom-0)
    • Desktop → fila: contenido a la izquierda, sidebar sticky a la derecha

    CLAVE STICKY:
      - El flex container NO debe tener overflow:hidden/auto/scroll.
      - El aside usa `self-start` para no estirarse al alto del flex.
      - `sticky top-8` funcionará siempre que el scroll sea del <body>/<html>.
  -->
  <div class="flex flex-col md:flex-row md:items-start max-w-350 mx-auto gap-4">

    <!-- Contenido principal -->
    <main class="flex-1 w-full min-w-0 flex flex-col gap-6
                 pb-24 md:pb-0">
      <app-panel-busqueda/>
      <app-panel-resultados/>
    </main>

    <!--
      SIDEBAR
      ──────────────────────────────────────────────────────────────────────
      MÓVIL  : fixed bottom-0, ancho 100%, barra superior con sombra
      DESKTOP: sticky top-8, shrink-0, altura automática (self-start)

      ¡IMPORTANTE! No pongas overflow:hidden en este elemento ni en sus padres.
      Si DevTools coloca overflow en el body/html, el sticky se rompe SÓLO en
      el inspector — en producción sigue funcionando. Para evitarlo en ambos
      ambientes se añade `self-start` que hace que el aside no crezca al alto
      del flex y permite que sticky calcule bien su posición.
    -->
    <aside
      class="
        fixed bottom-0 left-0 w-full z-50
        bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.08)]

        md:bottom-auto md:left-auto md:w-auto md:z-auto
        md:bg-transparent md:border-none md:shadow-none
        md:sticky md:top-8
        md:self-start md:shrink-0
      ">
      <app-action-sidebar
        [actions]="sidebarActions"
        (actionClick)="onAction($event)"/>
    </aside>

  </div>
</div>

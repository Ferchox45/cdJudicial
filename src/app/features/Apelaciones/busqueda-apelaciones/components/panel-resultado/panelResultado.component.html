<div class="bg-white border border-gray-200 rounded-lg">
  <app-table-reutilizable
    [columns]="columnasVisibles()"
    [data]="busqueda.resultados()"
    [paginaActual]="busqueda.paginaActual()"
    [totalPaginas]="busqueda.totalPaginas()"
    [totalResultados]="busqueda.totalResultados()"
    [porPagina]="busqueda.porPagina()"
    [mostrarColumnSelector]="true"
    [filaSeleccionada]="busqueda.filaSeleccionada()"
    [expandedTemplate]="detalleTmpl"
    (paginaCambio)="busqueda.irPagina($event)"
    (limitCambio)="busqueda.cambiarPorPagina($event)"
    (rowClick)="seleccionar($event)"
  />

  <ng-template #detalleTmpl let-fila>
    <app-panel-detalle [fila]="fila" />
  </ng-template>

  <!-- Botón Atrás -->
  <div class="bg-gray-50 px-4 md:px-8 py-4 flex justify-end border-t border-gray-100">
    <button
      type="button"
      class="w-full md:w-auto bg-sage text-forest font-bold md:font-medium px-6 py-3 md:py-2 rounded-md border border-sage-dark/20 flex justify-center items-center gap-2 cursor-pointer transition hover:bg-sage-dark"
      (click)="onBack()"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
        />
      </svg>
      Atrás
    </button>
  </div>
</div>

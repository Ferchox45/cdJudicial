<div class="w-full min-h-screen bg-cream px-6 py-8">

  <div class="mb-8 text-left">
    <h2 class="text-3xl font-bold text-strong-coffee m-0">Turnar a Sala</h2>
    <p class="text-gray-500 mt-1 mb-0">
      Consulte y gestione los turnos de apelaciones a la sala correspondiente.
    </p>
  </div>

  <div class="flex flex-col md:flex-row md:items-start gap-4">

    <main class="flex-1 w-full min-w-0 flex flex-col gap-6 pb-24 md:pb-0">
      <app-panel-busqueda-turnos/>
      <app-panel-resultados-turnos/>
    </main>

    <aside class="
      fixed bottom-0 left-0 w-full z-50
      bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.08)]
      md:bottom-auto md:left-auto md:w-auto md:z-auto
      md:bg-transparent md:border-none md:shadow-none
      md:sticky md:top-8 md:self-start md:shrink-0">
      <app-action-sidebar
        [actions]="sidebarActions"
        (actionClick)="onAction($event)"/>
    </aside>

  </div>
</div>

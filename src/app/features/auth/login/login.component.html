<div class="min-h-screen flex w-full bg-cream font-sans">

  <div class="hidden md:flex flex-col w-[35%] bg-forest items-center justify-center p-10 text-center relative shadow-xl z-10">
    <div class="mb-6 w-48 h-48 flex items-center justify-center">
      <img src="assets/images/logo-oaxaca.png" alt="Escudo de Oaxaca" class="object-contain w-full h-full drop-shadow-md">
    </div>

    <h1 class="text-bronze font-bold text-2xl tracking-wide uppercase mb-2">
      Consejo de la <br> Judicatura
    </h1>
    <p class="text-bon-white text-sm tracking-wider">
      Poder Judicial del Estado de Oaxaca
    </p>

    <div class="flex space-x-2 mt-12">
      <div class="h-1 w-8 bg-bronze rounded"></div>
      <div class="h-1 w-8 bg-sage-dark rounded opacity-50"></div>
      <div class="h-1 w-8 bg-sage-dark rounded opacity-50"></div>
    </div>
  </div>

  <div class="flex-1 flex flex-col justify-center items-center p-8 bg-cream">

    <div class="w-full max-w-md">
      <div class="mb-10 text-left">
        <h2 class="text-3xl font-bold text-bronze mb-2">Bienvenido de nuevo</h2>
        <p class="text-grey text-sm">Por favor, ingrese sus credenciales para acceder al sistema.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-grey">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <input
            type="text"
            formControlName="usuario"
            class="w-full pl-10 pr-4 py-3 border border-sage rounded-md focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest bg-white text-forest placeholder-grey transition-colors"
            placeholder="Usuario">
        </div>

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-grey">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="contrasena"
            class="w-full pl-10 pr-12 py-3 border border-sage rounded-md focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest bg-white text-forest placeholder-grey transition-colors"
            placeholder="Contraseña">

          <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-grey hover:text-forest">
            <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
          </button>
        </div>

        <div class="flex items-center justify-between mt-4">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" formControlName="recordarme" class="w-4 h-4 rounded border-sage text-forest focus:ring-forest accent-forest">
            <span class="text-sm text-grey select-none">Recordarme</span>
          </label>
          <a href="#" class="text-sm font-semibold text-forest hover:text-strong-coffee transition-colors">
            ¿Olvidó su contraseña?
          </a>
        </div>
        @if (errorMessage()) {
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md text-sm mb-4 flex items-center space-x-2">
              <svg class="w-5 h-5 shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
              </svg>
              <span>{{ errorMessage() }}</span>
            </div>
          }
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-forest text-white py-3 rounded-md font-medium mt-6 hover:bg-opacity-90 hover:shadow-lg transition-all disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2">

        @if (!isLoading()) {
          <span>Iniciar Sesión</span>
        } @else {
          <app-spinner size="md" color="white" ariaLabel="Verificando..." />
          <span>Verificando...</span>
        }
      </button>
      </form>

    </div>
  </div>
</div>

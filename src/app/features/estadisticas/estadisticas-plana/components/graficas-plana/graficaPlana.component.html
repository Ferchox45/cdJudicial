@if (slices().length) {
  <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col gap-4">
    <div class="flex items-center gap-2">
      <div class="w-1 h-6 bg-forest rounded-full"></div>
      <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wide truncate">
        {{ chartTitle() }}
      </h3>
    </div>

    <div class="flex flex-col sm:flex-row items-center gap-6">
      <canvas #chartCanvas width="260" height="260" class="shrink-0"></canvas>
      <ul class="flex flex-col gap-2 w-full">
        @for (slice of slices(); track slice.label; let i = $index) {
          <li class="flex items-center gap-3">
            <div class="flex items-center gap-2 w-28 shrink-0">
              <span class="w-3 h-3 rounded-full shrink-0" [style.background]="getColor(i)"></span>
              <span class="text-xs text-gray-600 truncate uppercase">{{ slice.label }}</span>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <span class="text-xs font-bold text-gray-800 w-4 text-right">{{ slice.value }}</span>
              <span class="text-xs text-gray-400 w-16">({{ pct(slice.value) }}%)</span>
            </div>
          </li>
        }
      </ul>
    </div>

    <div class="border-t border-gray-100 pt-3 flex items-center gap-3 text-xs text-gray-500">
      <span>Total:</span>
      <span class="font-bold text-gray-800">{{ total() }}</span>
    </div>
  </div>
} @else {
  <div
    class="bg-white rounded-2xl shadow-sm border border-dashed border-gray-300 flex flex-col items-center justify-center gap-3 p-10 text-center min-h-48"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-10 h-10 text-gray-300"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5
               20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75
               8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0
               .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5
               4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0
               .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
      />
    </svg>

    <p class="text-sm text-gray-400 font-medium">
      Selecciona cualquier celda de la tabla para poder graficar
    </p>
  </div>
}

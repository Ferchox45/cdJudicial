<app-table-reutilizable
  [columns]="columnas"
  [data]="busquedaEstadisticas.resultados()"
  [paginaActual]="busquedaEstadisticas.paginaActual()"
  [totalPaginas]="busquedaEstadisticas.totalPaginas()"
  [totalResultados]="busquedaEstadisticas.totalResultados()"
  [porPagina]="busquedaEstadisticas.porPagina()"
  [mostrarColumnSelector]="true"
  (paginaCambio)="busquedaEstadisticas.irPagina($event)"
  (limitCambio)="busquedaEstadisticas.cambiarPorPagina($event)"
/>

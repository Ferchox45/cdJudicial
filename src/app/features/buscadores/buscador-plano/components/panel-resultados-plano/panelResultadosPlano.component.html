<div class="bg-white border border-gray-200 rounded-lg overflow-hidden">

  <!-- ── Cabecera colapsable ──────────────────────────────────────────── -->
  <div class="bg-forest px-5 py-3.5 flex items-center justify-between cursor-pointer select-none border-b border-forest/20"
    (click)="toggle()">
    <div class="flex items-center gap-2.5 text-white">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Zm3.75 11.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/>
      </svg>
      <h2 class="text-sm font-bold text-white uppercase tracking-wide m-0">Resultados de Búsqueda</h2>
    </div>
    <svg class="w-4 h-4 text-white transition-transform duration-200"
      [class.rotate-180]="!abierto"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    </svg>
  </div>

  @if (abierto) {

    <!--
      TABLA CON SCROLL HORIZONTAL
      min-w-[1100px] garantiza que las columnas no colapsen en pantallas pequeñas.
      El usuario hace scroll horizontal en móvil de forma limpia.
    -->
    <div class="w-full overflow-x-auto">
      <table class="w-full border-collapse text-center min-w-275">

        <thead>
          <tr class="bg-sand border-b border-gray-200">
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Folio de Oficialia</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Folio de Apelación</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Folio de Apelación Anterior</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Tramite</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Sala</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Sala Anterior</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Apelación</th>
            <th class="px-4 py-4 text-xs font-bold text-black uppercase tracking-wide whitespace-nowrap">Tipo de Apelación</th>
          </tr>
        </thead>
        <tbody>
          <!--
            ITERACIÓN DE RESULTADOS
            Descomenta y conecta al servicio cuando implementes la lógica.

            @for (r of resultados(); track $index) {
              <tr class="border-b border-gray-100 cursor-pointer transition-colors hover:bg-cream">
                <td class="px-4 py-3.5 text-sm text-gray-500 font-medium">{{ $index + 1 }}</td>
                <td class="px-4 py-3.5 text-sm text-forest font-semibold whitespace-nowrap">{{ r.tramite }}</td>
                <td class="px-4 py-3.5 text-sm text-forest font-semibold whitespace-nowrap">{{ r.expCausa }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700 whitespace-nowrap font-medium">{{ r.toca }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700">{{ r.sala }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700 whitespace-nowrap">{{ r.folioRecepcion }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700">
                    {{ r.etapa }}
                  </span>
                </td>
                <td class="px-4 py-3.5 text-sm text-gray-700">{{ r.alcance }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700 whitespace-nowrap">{{ r.imputado }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700 whitespace-nowrap">{{ r.victima }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700">{{ r.delito }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700 whitespace-nowrap">{{ r.fechaRecepcion }}</td>
                <td class="px-4 py-3.5 text-sm text-gray-700 whitespace-nowrap">{{ r.fechaApelacion }}</td>
              </tr>
            }
          -->

          <!-- Estado vacío -->
          <tr>
            <td colspan="13"
              class="px-5 py-10 text-center text-gray-400 italic text-sm">
              No se encontraron resultados. Ajuste los filtros e intente de nuevo.
            </td>
          </tr>
        </tbody>

      </table>
    </div>

    <!-- ── Paginación ─────────────────────────────────────────────────── -->
    <div class="flex flex-col md:flex-row items-center justify-between
                px-4 md:px-5 py-4 border-t border-gray-100 bg-[#fafafa] gap-3">

      <span class="text-xs md:text-[0.8125rem] text-gray-500 text-center">
        Mostrando <strong>0–0</strong> de <strong>0</strong> resultados
      </span>

      <div class="flex items-center gap-1.5 flex-wrap justify-center">

        <!-- Anterior -->
        <button type="button" disabled
          class="min-w-8 h-8 px-2 border border-gray-200 rounded-md bg-white text-gray-700
                 text-[0.8125rem] cursor-pointer transition
                 hover:bg-sage hover:border-sage-dark hover:text-forest
                 disabled:opacity-40 disabled:cursor-not-allowed">
          Ant
        </button>

        <!-- Página activa (placeholder) -->
        <button type="button"
          class="min-w-8 h-8 px-2 border rounded-md text-[0.8125rem] cursor-pointer transition
                 bg-strong-coffee border-forest text-white font-bold">
          1
        </button>

        <!-- Siguiente -->
        <button type="button" disabled
          class="min-w-8 h-8 px-2 border border-gray-200 rounded-md bg-white text-gray-700
                 text-[0.8125rem] cursor-pointer transition
                 hover:bg-sage hover:border-sage-dark hover:text-forest
                 disabled:opacity-40 disabled:cursor-not-allowed">
          Sig
        </button>

      </div>
    </div>

  }
</div>


<div class="bg-white border border-gray-200 rounded-lg overflow-hidden">

  <!--  Cabecera colapsable -->
  <div class="bg-forest px-5 py-3.5 flex items-center justify-between cursor-pointer select-none border-b border-forest/20"
    (click)="toggle()">
    <div class="flex items-center gap-2.5 text-white">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      </svg>
      <h2 class="text-sm font-bold text-white uppercase tracking-wide m-0">Opciones de Búsqueda</h2>
    </div>
    <svg class="w-4 h-4 text-white transition-transform duration-200"
      [class.rotate-180]="!abierto"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    </svg>
  </div>

  @if (abierto) {
    <div class="p-4 md:p-6 flex flex-col gap-6 md:gap-10">

      <!-- DATOS DE APELACIÓN -->
      <section>
        <div class="flex items-center gap-2 mb-2">
          <span class="text-bronze flex">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </span>
          <h3 class="font-bold text-bronze uppercase tracking-widest text-sm m-0">Datos de Apelación</h3>
        </div>
        <hr class="mb-4 md:mb-5 opacity-40 border-t-2 border-solid border-bronze"/>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 md:gap-6">

          <!-- Exp/Causa -->
          <div class="flex flex-col gap-1.5">
            <label for="expCausa" class="text-xs font-bold text-gray-700">Exp / Causa</label>
            <input
              id="expCausa"
              name="expCausa"
              [ngModel]="Form.expedienteCausa"
              (ngModelChange)="updateForm('expedienteCausa', $event)"
              type="text"
              placeholder="Ej. 123/2024"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <!-- Toca -->
          <div class="flex flex-col gap-1.5">
            <label for="toca" class="text-xs font-bold text-gray-700">Toca</label>
            <input
              id="toca"
              name="toca"
              [ngModel]="Form.toca"
              (ngModelChange)="updateForm('toca', $event)"
              type="text"
              placeholder="Número de toca"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <!-- Sala -->
          <div class="flex flex-col gap-1.5">
            <label for="sala" class="text-xs font-bold text-gray-700">Sala</label>
            <select id="sala" name="sala"
              [ngModel]="Form.idSala"
              (ngModelChange)="updateForm('idSala', $event)"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white transition
                     focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"



              [disabled]="catalogoFacade.cargando()">
              <option value="">{{ catalogoFacade.cargando() ? 'Cargando...' : 'Seleccione Sala' }}</option>
              @for (item of catalogoFacade.salas(); track item.id) {
                <option [value]="item.id">{{ item.descripcion }}</option>
              }
            </select>
          </div>

        </div>
      </section>


      <!--  FECHAS -->
      <section>
        <div class="flex items-center gap-2 mb-2">
          <span class="text-bronze flex">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </span>
          <h3 class="font-bold text-bronze uppercase tracking-widest text-sm m-0">Fechas</h3>
        </div>
        <hr class="mb-4 md:mb-5 opacity-40 border-t-2 border-solid border-bronze"/>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 md:gap-6">

          <div class="flex flex-col gap-1.5">
            <label for="fechaRecIni" class="text-xs font-bold text-gray-700">Fecha Rec. Inicial</label>
            <input
              id="fechaRecIni"
              [ngModel]="Form.fechaRecepcionInicial"
              (ngModelChange)="updateForm('fechaRecepcionInicial', $event)"
              type="date"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="fechaRecFin" class="text-xs font-bold text-gray-700">Fecha Rec. Final</label>
            <input
              id="fechaRecFin"
              [ngModel]="Form.fechaRecepcionFinal"
              (ngModelChange)="updateForm('fechaRecepcionFinal', $event)"
              type="date"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="fechaApeIni" class="text-xs font-bold text-gray-700">Fecha Ape. Inicial</label>
            <input
              id="fechaApeIni"
              [ngModel]="Form.fechaApelacionInicial"
              (ngModelChange)="updateForm('fechaApelacionInicial', $event)"
              type="date"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="fechaApeFin" class="text-xs font-bold text-gray-700">Fecha Ape. Final</label>
            <input
              id="fechaApeFin"
              [ngModel]="Form.fechaApelacionFinal"
              (ngModelChange)="updateForm('fechaApelacionFinal', $event)"
              type="date"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

        </div>
      </section>

      <!-- PARTES E INFRACCIÓN -->
      <section>
        <div class="flex items-center gap-2 mb-2">
          <span class="text-bronze flex">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </span>
          <h3 class="font-bold text-bronze uppercase tracking-widest text-sm m-0">Partes e Infracción</h3>
        </div>
        <hr class="mb-4 md:mb-5 opacity-40 border-t-2 border-solid border-bronze"/>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 md:gap-6">

          <!-- Imputado -->
          <div class="flex flex-col gap-1.5">
            <label for="imputado" class="text-xs font-bold text-gray-700">Imputado</label>
            <input
              id="imputado"
              type="text"
              placeholder="Nombre del imputado"
              [ngModel]="Form.imputado"
              (ngModelChange)="updateForm('imputado', $event)"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <!-- Víctima -->
          <div class="flex flex-col gap-1.5">
            <label for="victima" class="text-xs font-bold text-gray-700">Víctima</label>
            <input
              id="victima"
              type="text"
              placeholder="Nombre de la víctima"
              [ngModel]="Form.victima"
              (ngModelChange)="updateForm('victima', $event)"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

          <!-- Delito -->
          <div class="flex flex-col gap-1.5 sm:col-span-2 md:col-span-1">
            <label for="delito" class="text-xs font-bold text-gray-700">Delito</label>
            <input
              id="delito"
              type="text"
              placeholder="Tipo de delito"
              [ngModel]="Form.delito"
              (ngModelChange)="updateForm('delito', $event)"
              class="w-full border border-gray-300 rounded-md px-3 py-3 md:py-2 text-sm bg-white
                     transition focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest"/>
          </div>

        </div>
      </section>
    </div>
  }

</div>

<app-table-reutilizable
  [columns]="columnas"
  [data]="buscarFacade.resultados()"
  [paginaActual]="buscarFacade.paginaActual()"
  [totalPaginas]="buscarFacade.totalPaginas()"
  [totalResultados]="buscarFacade.totalResultados()"
  [porPagina]="buscarFacade.porPagina()"
  [mostrarColumnSelector]="true"
  (paginaCambio)="buscarFacade.irPagina($event)"
  (limitCambio)="buscarFacade.cambiarPorPagina($event)"
/>

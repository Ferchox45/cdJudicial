<router-outlet></router-outlet>
<app-custom-modal
  [show]="modalService.isOpen()"
  [type]="modalService.config()?.type ?? 'info'"
  [title]="modalService.config()?.title ?? ''"
  [message]="modalService.config()?.message ?? ''"
  [confirmText]="modalService.config()?.confirmText ?? 'Aceptar'"
  [cancelText]="modalService.config()?.cancelText ?? 'Cancelar'"
   (confirm)="modalService.confirmar()"
   (cancel)="modalService.cancelar()"
/>

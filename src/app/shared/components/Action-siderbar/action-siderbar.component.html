
<aside class="flex flex-col gap-1.5 sticky top-20 self-start w-16">
  <button
    *ngFor="let action of actions"
    type="button"
    class="flex flex-col items-center justify-center gap-1
           w-14 h-14 rounded-lg cursor-pointer select-none
           border border-gray-300 text-emerald-900
           transition-all duration-150
           hover:bg-emerald-50 hover:border-emerald-400
           active:scale-95
           disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
    [ngClass]="{
      'bg-emerald-900 border-emerald-900 text-white hover:bg-emerald-800 hover:border-emerald-800': action.primary
    }"
    [disabled]="action.disabled ?? false"
    [attr.aria-label]="action.label"
    (click)="onClick(action.id)"
  >
    <!-- NUEVO -->
    <ng-container *ngIf="action.icon === 'nuevo'">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
    </ng-container>
    <!-- GUARDAR -->
    <ng-container *ngIf="action.icon === 'guardar'">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
    </ng-container>
    <!-- BUSCAR -->
    <ng-container *ngIf="action.icon === 'buscar'">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </ng-container>
    <!-- ANEXO -->
    <ng-container *ngIf="action.icon === 'anexo'">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </ng-container>
    <span class="text-[9px] font-bold tracking-widest uppercase leading-none">
      {{ action.label }}
    </span>
  </button>
</aside>

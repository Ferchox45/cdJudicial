<aside class="flex flex-row justify-evenly items-center w-full py-2 md:flex-col md:gap-1.5 md:w-16 md:py-0 md:sticky md:top-20 md:self-start">
  <button
    *ngFor="let action of actions"
    type="button"
    class="flex flex-col items-center justify-center gap-1
           w-14 h-14 rounded-lg cursor-pointer select-none
           disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
    [ngClass]="{
      'bg-forest border border-forest text-white hover:bg-forest-800 hover:border-forest-800': action.primary,
      'border border-gray-300 text-emerald-900 transition-all duration-150 hover:bg-emerald-50 hover:border-emerald-400 active:scale-95': !action.primary
    }"
    [disabled]="action.disabled ?? false"
    [attr.aria-label]="action.label"
    (click)="onClick(action.id)"
>
    <ng-container *ngIf="isIcon(action, 'nuevo')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
    </ng-container>
    <ng-container *ngIf="isIcon(action, 'guardar')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
    </ng-container>
    <ng-container *ngIf="isIcon(action, 'buscar')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </ng-container>
    <ng-container *ngIf="isIcon(action, 'anexo')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </ng-container>
    <ng-container *ngIf="isIcon(action, 'exportar')">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
  </ng-container>
  <ng-container *ngIf="isIcon(action, 'limpiar')">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2
            2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>
    </svg>
  </ng-container>
<ng-container *ngIf="isIcon(action, 'reporte')">
  <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <!-- Silueta del documento -->
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <!-- Texto PDF simplificado o líneas de reporte -->
    <path d="M9 13h2a2 2 0 0 0 0-4H9v6"></path>
    <path d="M13 15V9h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1z"></path>
  </svg>
</ng-container>
    <span class="text-[9px] font-bold tracking-widest uppercase leading-none">
      {{ action.label }}
    </span>
  </button>
</aside>
